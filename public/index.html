<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartList — Preço Condor Curitiba</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>SmartList</h1>
    <p class="subtitulo">Descubra em qual loja Condor de Curitiba um produto está mais barato.</p>

    <form id="form-busca">
      <input type="text" id="produto" placeholder="Ex: arroz 5kg, café, leite integral..." required />
      <button type="submit">Buscar</button>
    </form>

    <div id="status"></div>
    <div id="resultado"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
